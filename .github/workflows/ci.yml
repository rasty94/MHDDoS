name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Optional: installing 'uv' for faster resolution
        pip install uv
        uv pip install --system -r requirements.txt
        uv pip install --system ruff black isort pytest requests-mock

    - name: Check formatting with Black & isort
      run: |
        black --check .
        isort --check-only .
      continue-on-error: true  # Make true temporarily while transitioning the monolith

    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Run Pytest
      run: |
        pytest tests/ -v
